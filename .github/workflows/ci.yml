name: CI & Validação de Boas Práticas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Quality Gate (Lint, Testes & Build Estático)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar validação estática (lint)
        run: npm run lint

      - name: Executar suíte de testes automatizados
        run: npm test

      - name: Validar build estático e performance budget
        run: npm run build
